name: Build and deploy Astro catalog

on:
  pull_request:
    paths:
      - "web/**"
      - "warhammer-catalog/stock_data.json"
      - "warhammer-catalog/stock_match.py"
      - "warhammer-catalog/build_catalog.py"
      - "warhammer-scraper/data/products.json"
      - "warhammer-scraper/data/images/**"
      - ".github/workflows/cloudflare-pages.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "warhammer-catalog/stock_data.json"
      - "warhammer-catalog/stock_match.py"
      - "warhammer-catalog/build_catalog.py"
      - "warhammer-scraper/data/products.json"
      - "warhammer-scraper/data/images/**"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: warhammer-scraper/requirements.txt

      - name: Install dependencies
        run: |
          npm ci --prefix web
          python -m pip install -r warhammer-scraper/requirements.txt

      - name: Build static catalog
        run: npm run build --prefix web

      - name: Type-check and unit test
        run: npm run check --prefix web

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser test
        run: npm run test:e2e --prefix web

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=joytoy-catalog --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
