    <path d="M10.6 11.2h1.35v6.55c0 1.05.55 1.55 1.35 1.55.45 0 .85-.12 1.15-.35l.55 1.05c-.55.35-1.25.55-2 .55-1.65 0-2.4-1-2.4-2.55V11.2Z"/>
    <path d="M16.35 11.2h5.05v1.2h-1.85v7.35h-1.35v-7.35h-1.85v-1.2Z"/>
  </g>

  <!-- Oxide catalog mark -->
  <path d="M5 27.5h5.5" stroke="#a84636" stroke-width="1.35" stroke-linecap="square"/>
  <circle cx="27" cy="5" r="1.1" fill="#a84636" opacity="0.85"/>
