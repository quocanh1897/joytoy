<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JoyToy Field Archive">
  <defs>
    <linearGradient id="jt-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171713"/>
      <stop offset="100%" stop-color="#0c0d0a"/>
    </linearGradient>
    <linearGradient id="jt-brass" x1="8" y1="6" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0c477"/>
      <stop offset="100%" stop-color="#b99a50"/>
